<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Library</title>
        <link rel="stylesheet" href="./styles.css">
        <script src="./script.js" defer></script>
    </head>

    <body>
        <div class="header">
            <div class="heading">
                Welcome to Library...
            </div>
        </div>

        <div class="addBookContainer">
            <button class="addBookBtn" commandfor="formContainer" command="show-modal">Add Book</button>
        </div>
        <dialog id="formContainer">
            <form id="bookForm" method="get">
                <label for="title">Title</label>
                <input id="title" type="text" placeholder="Hunger Games" required>

                <label for="Author">Author</label>
                <input id="author" type="text" placeholder="Suzanne Collins" required>

                <label for="page">Pages</label>
                <input id="pages" type="text" placeholder="374">

                <button type="submit">Submit</button>
            </form>
        </dialog>

        <div class="main">
            <div id="bookGrid">
                
            </div>
        </div>
    </body>
</html>
